---
# ═══════════════════════════════════════════
# POSTGRES FOR MULTIPLAYER
# ═══════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentype-pg
  namespace: ns-ts2raneh
  labels:
    app: zentype-pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zentype-pg
  template:
    metadata:
      labels:
        app: zentype-pg
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: zentype_mp
            - name: POSTGRES_USER
              value: zentype
            - name: POSTGRES_PASSWORD
              value: zentype_mp_2026
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zentype-pg
  namespace: ns-ts2raneh
spec:
  selector:
    app: zentype-pg
  ports:
    - port: 5432
      targetPort: 5432

---
# ═══════════════════════════════════════════
# ZENTYPE MULTIPLAYER WEBSOCKET SERVER
