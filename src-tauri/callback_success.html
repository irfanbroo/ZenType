<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin-bottom: 0.5rem; }
        p { color: #888; }
        .success-icon {
            color: #4ade80;
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Authentication Successful!</h1>
        <p>You may now close this tab and return to ZenType.</p>
    </div>

    <script>
        // Supabase OAuth returns tokens in the URL fragment (#access_token=...)
        // But tiny_http only easily reads the raw URL path and query string.
        // We will immediately redirect the browser to turn the fragment into a query string
        // so our Rust server can read it correctly.
        window.onload = function() {
            const hash = window.location.hash;
            if (hash && hash.includes("access_token")) {
                const queryStr = hash.substring(1); // remove '#'
                // Redirect to the same URL but as query parameters
                window.location.replace("http://127.0.0.1:14200/callback?" + queryStr);
            } else if (window.location.search.includes("access_token")) {
                // If we're already redirected and Rust replied with this page, just close
                setTimeout(() => window.close(), 3000);
            }
        };
    </script>
</body>
</html>
